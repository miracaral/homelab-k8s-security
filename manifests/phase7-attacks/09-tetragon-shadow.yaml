# Phase 7, scenario C5 after Tetragon: the Phase 3 rule (phase3-runtime-security/block-shadow.yaml),
# unchanged except for the namespace. A process that reads /etc/shadow or /etc/gshadow is killed.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata: {name: block-sensitive-file-read, namespace: attack-lab}
spec:
  kprobes:
  - call: security_file_permission
    syscall: false
    args:
    - {index: 0, type: file}
    - {index: 1, type: int}
    selectors:
    - matchArgs:
      - {index: 0, operator: Equal, values: ["/etc/shadow", "/etc/gshadow"]}
      - {index: 1, operator: Equal, values: ["4"]}
      matchActions:
      - action: Sigkill
