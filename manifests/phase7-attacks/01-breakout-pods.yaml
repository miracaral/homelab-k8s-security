# Phase 7, scenario A: container breakout attempts. One pod per technique, so each result has one cause.
# Apply one at a time by label:  kubectl apply -f 01-breakout-pods.yaml -l attack=a1
#
# Safety rails, the same on every pod:
#   nodeSelector  -> only worker-5 (no application workloads there), never the control plane.
#                    No pod has a toleration, so the control-plane taint would refuse them anyway.
#   readOnly      -> every hostPath mount is read-only; the proofs only read.
#   no SA token, no restart, sleeps 10 minutes at most, then exits by itself.

# A0: baseline. A plain pod with no security settings, for comparison.
apiVersion: v1
kind: Pod
metadata: {name: a0-plain, namespace: attack-lab, labels: {attack: a0}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
---
# A1: privileged container. Gets every capability and the node's devices.
apiVersion: v1
kind: Pod
metadata: {name: a1-privileged, namespace: attack-lab, labels: {attack: a1}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
    securityContext: {privileged: true}
---
# A2: the node's root filesystem mounted into the pod (read-only here).
apiVersion: v1
kind: Pod
metadata: {name: a2-hostpath, namespace: attack-lab, labels: {attack: a2}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
    volumeMounts:
    - {name: host, mountPath: /host, readOnly: true}
  volumes:
  - name: host
    hostPath: {path: /}
---
# A3: the node's process namespace. The pod sees every process on the node.
apiVersion: v1
kind: Pod
metadata: {name: a3-hostpid, namespace: attack-lab, labels: {attack: a3}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  hostPID: true
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
---
# A4: the node's network namespace. The pod is on the node's own interfaces, outside pod network policy.
apiVersion: v1
kind: Pod
metadata: {name: a4-hostnetwork, namespace: attack-lab, labels: {attack: a4}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  hostNetwork: true
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
---
# A5: the container runtime's socket. Whoever can talk to containerd controls every container on the node.
# The second mount only borrows the node's own "ctr" client binary, read-only.
apiVersion: v1
kind: Pod
metadata: {name: a5-socket, namespace: attack-lab, labels: {attack: a5}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
    volumeMounts:
    - {name: sock, mountPath: /run/k3s/containerd/containerd.sock, readOnly: true}
    - {name: k3s-data, mountPath: /k3s-data, readOnly: true}
  volumes:
  - name: sock
    hostPath: {path: /run/k3s/containerd/containerd.sock, type: Socket}
  - name: k3s-data
    hostPath: {path: /var/lib/rancher/k3s/data}
---
# A6: not privileged, but with four dangerous capabilities added one by one.
apiVersion: v1
kind: Pod
metadata: {name: a6-capabilities, namespace: attack-lab, labels: {attack: a6}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
    securityContext:
      capabilities: {add: ["SYS_ADMIN", "SYS_PTRACE", "SYS_MODULE", "NET_RAW"]}
