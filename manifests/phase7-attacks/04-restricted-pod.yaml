# Phase 7: the kind of pod that Pod Security "restricted" still admits.
# Used to show what an attacker is left with inside a pod that passes admission.
apiVersion: v1
kind: Pod
metadata: {name: a8-restricted, namespace: attack-lab, labels: {attack: a8}}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-5}
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "600"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
